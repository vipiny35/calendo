<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendo</title>
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <div class="shell">
      <div
        class="popover"
        role="dialog"
        aria-modal="true"
        aria-labelledby="month-label"
      >
        <header class="header">
          <h1 id="month-label">Sep 2026</h1>
          <div class="nav">
            <button type="button" class="icon-button" id="prev-month">
              <span class="visually-hidden">Previous month</span>
            </button>
            <button type="button" class="icon-button" id="today-month">
              <span class="visually-hidden">Today</span>
            </button>
            <button type="button" class="icon-button" id="next-month">
              <span class="visually-hidden">Next month</span>
            </button>
          </div>
        </header>

        <div id="live" class="visually-hidden" aria-live="polite"></div>
        <div id="grid"></div>

        <section class="event-card" id="event-card" hidden aria-labelledby="event-title">
          <div class="event-heading">
            <span class="event-dot" aria-hidden="true"></span>
            <span class="event-status" id="event-status">No upcoming events</span>
          </div>
          <h2 id="event-title">Your calendar is clear</h2>
          <p class="event-meta" id="event-meta">New events will appear here automatically.</p>
          <button type="button" class="join-meeting" id="join-meeting" hidden></button>
          <button type="button" class="join-meeting" id="calendar-access" hidden>Allow Calendar Access</button>
        </section>

        <section class="day-events" id="day-events" hidden aria-labelledby="day-events-title">
          <div class="day-events-heading">
            <h2 id="day-events-title">Selected day</h2>
            <span id="day-events-count"></span>
          </div>
          <div class="day-events-list" id="day-events-list"></div>
        </section>

        <footer class="footer">
          <button type="button" class="icon-button" id="settings">
            <span class="visually-hidden">Settings</span>
          </button>
        </footer>
      </div>
    </div>
    <script src="calendar.js"></script>
  </body>
</html>
