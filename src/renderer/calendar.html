<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Calendo</title>
    <link rel="stylesheet" href="calendar.css" />
  </head>
  <body>
    <div class="shell">
      <div
        class="popover"
        role="dialog"
        aria-modal="true"
        aria-labelledby="month-label"
      >
        <header class="header">
          <button type="button" class="icon-button" id="prev-month">
            <span class="visually-hidden">Previous month</span>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                d="M10.4 2.6 4.8 8l5.6 5.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <h1 id="month-label">September 2026</h1>
          <button type="button" class="icon-button" id="next-month">
            <span class="visually-hidden">Next month</span>
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
              <path
                d="M5.6 2.6 11.2 8l-5.6 5.4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </header>
        <div id="live" class="visually-hidden" aria-live="polite"></div>
        <div id="grid"></div>
        <footer class="footer">
          <button type="button" class="today" id="today">Today</button>
          <button type="button" class="icon-button" id="settings">
            <span class="visually-hidden">Settings</span>
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <circle
                cx="8"
                cy="8"
                r="2.15"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M8 1.6v1.5M8 12.9v1.5M14.4 8h-1.5M3.1 8H1.6M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1M12.5 12.5l-1.1-1.1M4.6 4.6 3.5 3.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </footer>
      </div>
    </div>
    <script src="calendar.js"></script>
  </body>
</html>
