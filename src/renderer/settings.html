<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body>
    <main class="page">
      <div class="tabs" id="tabs" role="tablist" aria-label="Settings">
        <div class="brand" aria-hidden="true">
          <img class="brand-icon" src="icon.png" alt="" />
          <span>Calendo</span>
        </div>
        <button
          type="button"
          role="tab"
          id="tab-general"
          aria-controls="panel-general"
          aria-selected="true"
          data-tab="general"
        >
          General
        </button>
        <button
          type="button"
          role="tab"
          id="tab-appearance"
          aria-controls="panel-appearance"
          aria-selected="false"
          data-tab="appearance"
        >
          Appearance
        </button>
        <button
          type="button"
          role="tab"
          id="tab-about"
          aria-controls="panel-about"
          aria-selected="false"
          data-tab="about"
        >
          About
        </button>
      </div>

      <form id="form" autocomplete="off">
        <section
          class="panel"
          id="panel-general"
          role="tabpanel"
          aria-labelledby="tab-general"
        >
          <div class="card">
            <div class="row">
              <div class="copy">
                <label for="login">Launch at login</label>
              </div>
              <input id="login" name="launchAtLogin" type="checkbox" />
            </div>
            <div class="row">
              <div class="copy">
                <label for="beep">Beep beep on the hour</label>
              </div>
              <div class="row-controls">
                <button
                  type="button"
                  class="preview"
                  id="beep-preview"
                  aria-label="Preview beep"
                ></button>
                <input id="beep" name="beepOnTheHour" type="checkbox" />
              </div>
            </div>
            <div class="row">
              <div class="copy">
                <label for="auto-update">Automatically check for updates</label>
              </div>
              <input id="auto-update" name="autoUpdate" type="checkbox" />
            </div>
            <div class="row">
              <label for="week-start">First day of the week</label>
              <select id="week-start" name="weekStartsOn"></select>
            </div>
          </div>
          <div class="group">
            <h2 id="calendar-events-heading">Calendar events</h2>
            <div class="card">
              <div class="row">
                <label for="show-upcoming">Show upcoming event in menu bar</label>
                <input id="show-upcoming" name="showUpcomingEvent" type="checkbox" />
              </div>
              <p class="calendar-access-status" id="calendar-access-status" aria-live="polite" hidden></p>
              <div class="row" id="calendar-access-row">
                <label for="calendar-access">Calendar access</label>
                <button type="button" class="action" id="calendar-access">Allow Access…</button>
              </div>
            </div>
          </div>
        </section>

        <section
          class="panel"
          id="panel-appearance"
          role="tabpanel"
          aria-labelledby="tab-appearance"
          hidden
        >
          <div class="group">
            <h2 id="menubar-heading">Menu bar</h2>
            <div class="card">
              <div
                class="icon-styles"
                id="icon-styles"
                role="radiogroup"
                aria-labelledby="menubar-heading"
              ></div>
              <div class="row">
                <label for="show-weekday">Show day of week</label>
                <input id="show-weekday" name="showWeekday" type="checkbox" />
              </div>
              <div class="row">
                <label for="show-month">Show month</label>
                <input id="show-month" name="showMonth" type="checkbox" />
              </div>
            </div>
          </div>

          <div class="group">
            <h2 id="calendar-heading">Calendar</h2>
            <div class="card">
              <div class="row">
                <div class="copy">
                  <label for="week-numbers">Week numbers</label>
                  <p>ISO week numbers along the left edge of the month.</p>
                </div>
                <input id="week-numbers" name="showWeekNumbers" type="checkbox" />
              </div>
              <div class="row highlight-row">
                <div class="copy">
                  <label id="highlight-label">Highlight</label>
                </div>
                <div
                  class="weekday-picker"
                  id="highlight-days"
                  role="group"
                  aria-labelledby="highlight-label"
                ></div>
              </div>
            </div>
          </div>

          <div class="group">
            <h2 id="theme-heading">Theme</h2>
            <div class="card">
              <div class="row">
                <label for="theme">Appearance</label>
                <select id="theme" name="theme">
                  <option value="system">Match System</option>
                  <option value="light">Light</option>
                  <option value="dark">Dark</option>
                </select>
              </div>
            </div>
          </div>
        </section>

        <section
          class="panel"
          id="panel-about"
          role="tabpanel"
          aria-labelledby="tab-about"
          hidden
        >
          <div class="about">
            <img class="about-icon" src="icon.png" alt="Calendo app icon" />
            <p class="about-name">Calendo</p>
            <p class="about-version" id="version">Calendo</p>
            <p class="about-author">Created by Vipin Yadav</p>
            <a
              class="about-link"
              href="https://vipinyadav.com"
              target="_blank"
              rel="noreferrer"
            >
              vipinyadav.com
            </a>
            <p class="about-copy">
              A month calendar in the macOS menu bar. Nothing leaves this Mac.
            </p>
            <button type="button" class="action" id="check-updates">Check for Updates</button>
            <button type="button" class="action" id="install-update" hidden>
              Update and Restart
            </button>
            <p class="about-version" id="update-status" aria-live="polite"></p>
          </div>
        </section>
      </form>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
